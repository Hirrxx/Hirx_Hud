<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hirx_hud</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="hud-root" class="hud-root is-hidden style-minimal" aria-hidden="true">

        <!-- =========================================================
             ESTILO 1: MINIMAL (Capsula horizontal + velocimetro)
             ========================================================= -->
        <div class="layout-minimal">
            <div class="hud-surface minimal-status">
                <div class="m-item" title="Vida">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <div class="m-track"><div class="m-fill" data-bar="hp"></div></div>
                </div>
                <div class="m-item" title="Armadura">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z"/></svg>
                    <div class="m-track"><div class="m-fill" data-bar="armor"></div></div>
                </div>
                <div class="m-item" title="Comida">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>
                    <div class="m-track"><div class="m-fill" data-bar="food"></div></div>
                </div>
                <div class="m-item" title="Stamina">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>
                    <div class="m-track"><div class="m-fill" data-bar="stamina"></div></div>
                </div>
                <div class="m-item" title="Oxigeno">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                    <div class="m-track"><div class="m-fill" data-bar="oxygen"></div></div>
                </div>

                <div class="v-sep"></div>

                <div class="voice-wrap">
                    <div class="voice-circle" data-voice-circle>
                        <svg class="icon-sm" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                    </div>
                    <div class="voice-bars" data-voice-bars>
                        <span class="vb vb-1"></span>
                        <span class="vb vb-2"></span>
                        <span class="vb vb-3"></span>
                    </div>
                </div>
            </div>

            <div class="hud-surface minimal-speedo speedo-box">
                <div class="ms-top">
                    <div class="ms-speed">
                        <span class="speed-num" data-speed-num>0</span>
                        <span class="speed-unit" data-speed-unit>KM/H</span>
                    </div>
                    <span class="gear-pill" data-gear>N</span>
                </div>
                <div class="ms-track">
                    <div class="ms-fill" data-speed-bar></div>
                </div>
            </div>
        </div>

        <!-- =========================================================
             ESTILO 2: RINGS (Anillos circulares + velocimetro arco)
             ========================================================= -->
        <div class="layout-rings">
            <div class="rings-status">
                <div class="hud-surface ring-card" title="Vida">
                    <svg class="ring-svg" viewBox="0 0 40 40">
                        <circle class="ring-bg" cx="20" cy="20" r="16" />
                        <circle class="ring-fg" data-ring="hp" cx="20" cy="20" r="16" />
                    </svg>
                    <svg class="icon ring-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <div class="hud-surface ring-card" title="Armadura">
                    <svg class="ring-svg" viewBox="0 0 40 40">
                        <circle class="ring-bg" cx="20" cy="20" r="16" />
                        <circle class="ring-fg" data-ring="armor" cx="20" cy="20" r="16" />
                    </svg>
                    <svg class="icon ring-icon" viewBox="0 0 24 24"><path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z"/></svg>
                </div>
                <div class="hud-surface ring-card" title="Comida">
                    <svg class="ring-svg" viewBox="0 0 40 40">
                        <circle class="ring-bg" cx="20" cy="20" r="16" />
                        <circle class="ring-fg" data-ring="food" cx="20" cy="20" r="16" />
                    </svg>
                    <svg class="icon ring-icon" viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>
                </div>
                <div class="hud-surface ring-card" title="Stamina">
                    <svg class="ring-svg" viewBox="0 0 40 40">
                        <circle class="ring-bg" cx="20" cy="20" r="16" />
                        <circle class="ring-fg" data-ring="stamina" cx="20" cy="20" r="16" />
                    </svg>
                    <svg class="icon ring-icon" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>
                </div>
                <div class="hud-surface ring-card" title="Oxigeno">
                    <svg class="ring-svg" viewBox="0 0 40 40">
                        <circle class="ring-bg" cx="20" cy="20" r="16" />
                        <circle class="ring-fg" data-ring="oxygen" cx="20" cy="20" r="16" />
                    </svg>
                    <svg class="icon ring-icon" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                </div>
                <div class="hud-surface ring-card voice-ring-card" data-voice-ring title="Voz">
                    <svg class="ring-svg" viewBox="0 0 40 40">
                        <circle class="ring-bg" cx="20" cy="20" r="16" />
                        <circle class="ring-fg" data-ring="voice" cx="20" cy="20" r="16" />
                    </svg>
                    <svg class="icon ring-icon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </div>
            </div>

            <div class="hud-surface rings-speedo speedo-box">
                <svg class="arc-svg" viewBox="0 0 100 100">
                    <circle class="arc-bg" cx="50" cy="50" r="42" />
                    <circle class="arc-fg" data-speed-arc cx="50" cy="50" r="42" />
                </svg>
                <div class="arc-center">
                    <span class="arc-speed" data-speed-num>0</span>
                    <span class="arc-unit" data-speed-unit>KM/H</span>
                    <span class="arc-gear" data-gear-prefix>M N</span>
                </div>
            </div>
        </div>

        <!-- =========================================================
             ESTILO 3: TACTICAL (Dock simetrico centro-abajo)
             ========================================================= -->
        <div class="layout-tactical">
            <div class="hud-surface tactical-dock">
                <div class="t-left">
                    <div class="t-top-bars">
                        <div class="t-bar-group">
                            <svg class="icon-xs" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            <div class="t-track"><div class="t-fill" data-bar="hp"></div></div>
                        </div>
                        <div class="t-bar-group">
                            <svg class="icon-xs" viewBox="0 0 24 24"><path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z"/></svg>
                            <div class="t-track"><div class="t-fill t-fill-muted" data-bar="armor"></div></div>
                        </div>
                    </div>

                    <div class="t-bottom-stats">
                        <div class="t-stat" title="Comida">
                            <svg class="icon-xs muted" viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>
                            <span data-txt="food">100%</span>
                        </div>
                        <div class="t-stat" title="Stamina">
                            <svg class="icon-xs muted" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>
                            <span data-txt="stamina">100%</span>
                        </div>
                        <div class="t-stat" title="Oxigeno">
                            <svg class="icon-xs muted" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                            <span data-txt="oxygen">100%</span>
                        </div>
                        <div class="t-stat" title="Voz">
                            <svg class="icon-xs" data-voice-dot viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                            <span data-voice-label>Normal</span>
                        </div>
                    </div>
                </div>

                <div class="t-speedo-wrap speedo-box">
                    <div class="v-sep-lg"></div>
                    <div class="t-speedo">
                        <div>
                            <div class="t-speed-line">
                                <span class="t-speed-num" data-speed-num>0</span>
                                <span class="t-speed-unit" data-speed-unit>KM/H</span>
                            </div>
                            <div class="t-speed-track">
                                <div class="t-speed-fill" data-speed-bar></div>
                            </div>
                        </div>
                        <span class="gear-pill" data-gear>N</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
